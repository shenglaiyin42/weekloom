<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekloom · 周织</title>
  <style>
    :root { --ink:#1d2633; --muted:#667085; --line:#e5e7eb; --paper:#f7f8fa; --accent:#365bce; --accent-soft:#eaf0ff; --good:#16734b; --warn:#a45c00; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { background:#172033; color:#fff; padding:28px max(22px, calc((100% - 1120px)/2)); }
    header h1 { margin:0 0 4px; font-size:28px; letter-spacing:.01em; }
    header p { margin:0; color:#cbd5e1; }
    main { max-width:1120px; margin:24px auto 56px; padding:0 22px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    .toolbar button, button { border:0; border-radius:8px; background:var(--accent); color:#fff; padding:9px 14px; cursor:pointer; font-weight:600; }
    button.secondary { color:var(--ink); background:#fff; border:1px solid var(--line); }
    .status { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:0 2px 8px rgba(15,23,42,.03); }
    .span-12 { grid-column:span 12; } .span-8 { grid-column:span 8; } .span-4 { grid-column:span 4; }
    h2 { margin:0 0 12px; font-size:18px; } h3 { margin:0; font-size:15px; }
    .eyebrow { color:var(--muted); font-size:13px; margin-bottom:3px; }
    .outcomes { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .pill { background:var(--accent-soft); color:#2946a1; border-radius:999px; padding:5px 10px; font-size:13px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .stat { border:1px solid var(--line); border-radius:8px; padding:10px; } .stat b { display:block; font-size:22px; }
    .item { border-top:1px solid var(--line); padding:12px 0; } .item:first-child { border-top:0; padding-top:0; }
    .item-title { font-weight:650; } .meta { color:var(--muted); font-size:12px; margin-top:3px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    select, input, textarea { border:1px solid #d8dde6; border-radius:7px; padding:8px; font:inherit; width:100%; background:#fff; }
    select { width:auto; padding:5px 8px; font-size:13px; }
    form { display:grid; gap:9px; } label { font-size:13px; color:var(--muted); }
    textarea { min-height:72px; resize:vertical; } .empty { color:var(--muted); }
    .notice { padding:9px 11px; background:#fff8e8; color:var(--warn); border-radius:8px; font-size:13px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .form-grid .full { grid-column:1 / -1; }
    .check { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:13px; }
    .check input { width:auto; }
    @media (max-width:800px) { .span-8,.span-4 { grid-column:span 12; } .toolbar { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header><h1>Weekloom <span>· 周织</span></h1><p>把项目织进每一周。</p></header>
  <main>
    <div class="toolbar"><div><div class="eyebrow">当前周</div><h2 id="week-title">加载中…</h2></div><div><span class="status" id="save-status">正在读取本地数据</span> <button class="secondary" id="refresh">刷新</button></div></div>
    <div id="no-week" class="notice" hidden>还没有周计划。请先在数据目录中创建 Week JSON 文件。</div>
    <div class="grid">
      <section class="card span-8"><div class="eyebrow">本周主题</div><form id="week-form"><input id="week-theme" maxlength="240" placeholder="给这一周一个主题"><label for="week-outcomes">核心成果（最多三项，每行一项）</label><textarea id="week-outcomes" maxlength="720" placeholder="例如：完成第一版本地 App"></textarea><button type="submit">保存本周设置</button></form><div class="outcomes" id="outcomes"></div></section>
      <section class="card span-4"><h2>概览</h2><div class="stats"><div class="stat"><span class="eyebrow">活跃项目</span><b id="active-projects">0</b></div><div class="stat"><span class="eyebrow">行动完成</span><b id="done-actions">0/0</b></div><div class="stat"><span class="eyebrow">Inbox</span><b id="open-inbox">0</b></div></div></section>
      <section class="card span-8"><h2>本周行动</h2><div id="actions"><p class="empty">暂无本周行动。</p></div></section>
      <section class="card span-4"><h2>快速收集</h2><form id="inbox-form"><label for="inbox-title">想到什么先记下来</label><input id="inbox-title" required maxlength="240" placeholder="例如：试用一周后记录最不顺手的地方"><textarea id="inbox-notes" maxlength="2000" placeholder="可选备注"></textarea><button type="submit">加入 Inbox</button></form><div id="inbox-list" style="margin-top:18px"></div></section>
      <section class="card span-4"><h2>新建项目</h2><form id="project-form"><label for="project-name">项目名称</label><input id="project-name" required maxlength="160" placeholder="例如：完成个人作品集"><label for="project-category">类别</label><select id="project-category"><option value="work">工作</option><option value="personal_project" selected>个人项目</option><option value="personal_life">个人生活</option><option value="interest_learning">兴趣与学习</option></select><label for="project-goal">目标</label><input id="project-goal" maxlength="500" placeholder="希望达成的结果"><label for="project-description">说明（可选）</label><textarea id="project-description" maxlength="2000"></textarea><button type="submit">创建项目</button></form></section>
      <section class="card span-8"><h2>加入本周行动</h2><form id="action-form"><div class="form-grid"><div><label for="action-title">行动名称</label><input id="action-title" required maxlength="240" placeholder="例如：整理作品集首页内容"></div><div><label for="action-project">所属项目</label><select id="action-project"><option value="">独立行动</option></select></div><div><label for="action-category">类别</label><select id="action-category"><option value="work">工作</option><option value="personal_project" selected>个人项目</option><option value="personal_life">个人生活</option><option value="interest_learning">兴趣与学习</option></select></div><div><label for="action-priority">优先级</label><select id="action-priority"><option value="urgent">紧急</option><option value="high">高</option><option value="normal" selected>普通</option><option value="low">低</option></select></div><div><label for="action-role">本周角色</label><select id="action-role"><option value="focus">本周重点</option><option value="planned" selected>一般计划</option><option value="candidate">候选事项</option><option value="recurring">例行事项</option></select></div><div><label for="action-due">截止日期（可选）</label><input id="action-due" type="date"></div><div><label for="action-estimate">估计分钟（可选）</label><input id="action-estimate" type="number" min="1" max="1440" placeholder="例如：30"></div><label class="check"><input id="action-next" type="checkbox"> 设为项目下一步</label><div class="full"><label for="action-notes">备注（可选）</label><textarea id="action-notes" maxlength="2000"></textarea></div></div><button type="submit">加入本周</button></form></section>
      <section class="card span-4"><h2>项目</h2><div id="projects"><p class="empty">暂无项目。</p></div></section>
      <section class="card span-8"><div class="row"><h2>周复盘</h2><button class="secondary" type="button" id="codex-review">提交给 Codex</button></div><form id="review-form"><label for="wins">完成与收获（每行一项）</label><textarea id="wins" placeholder="例如：完成了…"></textarea><label for="unfinished">未完成与原因（每行一项）</label><textarea id="unfinished" placeholder="例如：…因为…"></textarea><label for="blockers">阻碍（每行一项）</label><textarea id="blockers"></textarea><label for="decisions">本周决定（每行一项）</label><textarea id="decisions"></textarea><label for="next-focus">下周重点（最多三项，每行一项）</label><textarea id="next-focus"></textarea><label for="rating">本周整体评分（1–5，可选）</label><input id="rating" type="number" min="1" max="5"><button type="submit">保存复盘</button></form></section>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const lines = (value) => value.split('\n').map((line) => line.trim()).filter(Boolean);
    const labels = { todo:'待办', doing:'进行中', done:'已完成', dropped:'放弃' };
    const projectStatusLabels = { active:'推进中', waiting:'等待中', paused:'已暂停', completed:'已完成', archived:'已归档' };
    const categoryLabels = { work:'工作', personal_project:'个人项目', personal_life:'个人生活', interest_learning:'兴趣与学习' };
    let state;
    async function request(url, options) { const response = await fetch(url, options); const payload = await response.json(); if (!response.ok) throw new Error(payload.error || '请求失败'); return payload; }
    function render() {
      const week = state.week; $('no-week').hidden = Boolean(week); $('week-title').textContent = week ? `${week.id} · ${week.week_start} — ${week.week_end}` : '尚未建立周计划'; $('week-theme').value = week?.theme || ''; $('week-outcomes').value = (week?.core_outcomes || []).join('\n'); $('week-form').querySelectorAll('input,textarea,button').forEach((element) => { element.disabled = !week; });
      $('outcomes').innerHTML = (week?.core_outcomes || []).map((item) => `<span class="pill">${escapeHtml(item)}</span>`).join(''); $('active-projects').textContent = state.counts.active_projects; $('done-actions').textContent = `${state.counts.done_actions}/${state.counts.week_actions}`; $('open-inbox').textContent = state.counts.open_inbox;
      $('actions').innerHTML = state.actions.length ? state.actions.map((action) => `<div class="item"><div class="row"><div><div class="item-title">${escapeHtml(action.title)}</div><div class="meta">${escapeHtml(action.category)} · ${escapeHtml(action.priority)}${action.is_next_action ? ' · 下一步' : ''}</div></div><select data-action-id="${action.id}" aria-label="${escapeHtml(action.title)} 状态">${Object.entries(labels).map(([key,label]) => `<option value="${key}" ${key===action.status?'selected':''}>${label}</option>`).join('')}</select></div></div>`).join('') : '<p class="empty">暂无本周行动。</p>';
      $('projects').innerHTML = state.projects.length ? state.projects.slice(0,8).map((project) => `<div class="item"><div class="row"><div><div class="item-title">${escapeHtml(project.name)}</div><div class="meta">${escapeHtml(categoryLabels[project.category] || project.category)} · ${project.progress}%</div></div><select data-project-status="${project.id}" aria-label="${escapeHtml(project.name)} 状态">${Object.entries(projectStatusLabels).map(([key,label]) => `<option value="${key}" ${key===project.status?'selected':''}>${label}</option>`).join('')}</select></div><input data-project-progress="${project.id}" aria-label="${escapeHtml(project.name)} 进度" type="range" min="0" max="100" value="${project.progress}" style="width:100%;margin-top:9px"></div>`).join('') : '<p class="empty">暂无项目。</p>';
      $('action-project').innerHTML = `<option value="">独立行动</option>${state.projects.filter((project) => project.status !== 'archived').map((project) => `<option value="${project.id}">${escapeHtml(project.name)}</option>`).join('')}`;
      $('inbox-list').innerHTML = state.inbox.length ? `<div class="eyebrow">待整理</div>${state.inbox.slice(0,5).map((item) => `<div class="item"><div class="item-title">${escapeHtml(item.title)}</div><div class="meta">${escapeHtml(item.notes || '暂无备注')}</div><div class="row" style="margin-top:8px"><select data-inbox-target="${item.id}" aria-label="${escapeHtml(item.title)} 整理方式"><option value="action">转为行动</option><option value="project">转为项目</option><option value="dismiss">暂不处理</option></select><button class="secondary" type="button" data-process-inbox="${item.id}">整理</button></div></div>`).join('')}` : '<p class="empty">Inbox 是空的。</p>';
      const review = state.review || {}; $('wins').value = (review.wins || []).join('\n'); $('unfinished').value = (review.unfinished || []).join('\n'); $('blockers').value = (review.blockers || []).join('\n'); $('decisions').value = (review.decisions || []).join('\n'); $('next-focus').value = (review.next_week_focus || []).join('\n'); $('rating').value = review.overall_rating || '';
      document.querySelectorAll('[data-action-id]').forEach((select) => select.addEventListener('change', updateAction)); const syncText = state.sync?.configured ? `${state.sync.has_remote ? '私人 Git 已连接' : '私人 Git 未连接'}${state.sync.dirty ? ` · ${state.sync.change_count} 项本地更改` : ' · 工作区干净'}` : '私人 Git 尚未配置'; $('save-status').textContent = `本地数据：${state.data_dir} · ${syncText}${state.counts.pending_requests ? ` · 待处理复盘请求 ${state.counts.pending_requests}` : ''}`;
      document.querySelectorAll('[data-project-status]').forEach((select) => select.addEventListener('change', updateProject)); document.querySelectorAll('[data-project-progress]').forEach((input) => input.addEventListener('change', updateProject));
      document.querySelectorAll('[data-process-inbox]').forEach((button) => button.addEventListener('click', processInbox));
    }
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    async function load() { try { state = await request('/api/summary'); render(); } catch (error) { $('save-status').textContent = error.message; } }
    async function updateAction(event) { try { await request(`/api/actions/${event.target.dataset.actionId}/status`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:event.target.value}) }); await load(); } catch (error) { alert(error.message); } }
    async function updateProject(event) { const projectId = event.target.dataset.projectStatus || event.target.dataset.projectProgress; const statusElement = document.querySelector(`[data-project-status="${projectId}"]`); const progressElement = document.querySelector(`[data-project-progress="${projectId}"]`); try { await request(`/api/projects/${projectId}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:statusElement.value, progress:Number(progressElement.value)}) }); await load(); } catch (error) { alert(error.message); } }
    async function processInbox(event) { const inboxId = event.target.dataset.processInbox; const target = document.querySelector(`[data-inbox-target="${inboxId}"]`).value; try { await request(`/api/inbox/${inboxId}/process`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({target_type:target}) }); await load(); } catch (error) { alert(error.message); } }
    $('refresh').addEventListener('click', load);
    $('week-form').addEventListener('submit', async (event) => { event.preventDefault(); if (!state?.week) return; try { await request(`/api/weeks/${state.week.id}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({theme:$('week-theme').value, core_outcomes:lines($('week-outcomes').value).slice(0,3), status:state.week.status}) }); await load(); } catch (error) { alert(error.message); } });
    $('project-form').addEventListener('submit', async (event) => { event.preventDefault(); try { await request('/api/projects', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:$('project-name').value, category:$('project-category').value, goal:$('project-goal').value, description:$('project-description').value}) }); event.target.reset(); $('project-category').value = 'personal_project'; await load(); } catch (error) { alert(error.message); } });
    $('action-project').addEventListener('change', (event) => { const project = state?.projects?.find((item) => item.id === event.target.value); if (project) $('action-category').value = project.category; });
    $('action-form').addEventListener('submit', async (event) => { event.preventDefault(); try { await request('/api/actions', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:$('action-title').value, project_id:$('action-project').value || null, category:$('action-category').value, priority:$('action-priority').value, weekly_role:$('action-role').value, due_date:$('action-due').value || null, estimate_minutes:$('action-estimate').value || null, is_next_action:$('action-next').checked, notes:$('action-notes').value}) }); event.target.reset(); $('action-category').value = 'personal_project'; $('action-priority').value = 'normal'; $('action-role').value = 'planned'; await load(); } catch (error) { alert(error.message); } });
    $('inbox-form').addEventListener('submit', async (event) => { event.preventDefault(); try { await request('/api/inbox', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:$('inbox-title').value, notes:$('inbox-notes').value}) }); event.target.reset(); await load(); } catch (error) { alert(error.message); } });
    $('review-form').addEventListener('submit', async (event) => { event.preventDefault(); if (!state?.week) return; try { await request(`/api/reviews/${state.week.id}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({wins:lines($('wins').value), unfinished:lines($('unfinished').value), blockers:lines($('blockers').value), decisions:lines($('decisions').value), next_week_focus:lines($('next-focus').value).slice(0,3), overall_rating:$('rating').value, notes:''}) }); $('save-status').textContent = '复盘已保存到本地'; await load(); } catch (error) { alert(error.message); } });
    $('codex-review').addEventListener('click', async () => { if (!state?.week) return; try { await request('/api/requests/review', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({week_id:state.week.id}) }); $('save-status').textContent = '复盘请求已写入私人数据目录的 pending'; await load(); } catch (error) { alert(error.message); } });
    load();
  </script>
</body>
</html>
